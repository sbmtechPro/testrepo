# CodeQL analysis for this repository.
# Runs on pushes to main, on every pull request, and weekly on a schedule.
name: "CodeQL Advanced"

on:
  push:
    branches: ["main"]
  # Run CodeQL on every pull request, regardless of the target branch.
  pull_request: {}
  schedule:
    - cron: "24 23 * * 6"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}

    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          # More languages can be added here, for example:
          # - language: javascript-typescript
          #   build-mode: none
          # - language: python
          #   build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Custom/local CodeQL queries can be added later with a config file.
          # Example:
          # config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
